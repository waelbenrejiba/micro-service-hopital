version: "3.8"

services:
  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8002:8002"
    environment:
      - CONFIG_SERVICE_PORT=8002
      - ENV=dev
    networks:
      - hopital-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8001:8001"
    environment:
      - DISCOVERY_SERVICE_PORT=8001
      - ENV=dev
    networks:
      - hopital-net
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - DISCOVERY_URL=http://discovery-service:8001
      - CONFIG_URL=http://config-service:8002
      - ENV=dev
    networks:
      - hopital-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=user-service
      - SERVICE_PORT=8003
      - SERVICE_HOST=user-service
      - DISCOVERY_URL=http://discovery-service:8001
      - CONFIG_URL=http://config-service:8002
      - ENV=dev
    networks:
      - hopital-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=order-service
      - SERVICE_PORT=8004
      - SERVICE_HOST=order-service
      - DISCOVERY_URL=http://discovery-service:8001
      - CONFIG_URL=http://config-service:8002
      - ENV=dev
    networks:
      - hopital-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  front:
    build: ./front
    container_name: front
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://localhost:8000
    networks:
      - hopital-net
    depends_on:
      - gateway

networks:
  hopital-net:
    driver: bridge
